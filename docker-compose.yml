services:
  database:
    build:
      context: ./Database
      dockerfile: Dockerfile
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./Database/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: localhost #redis_server
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - app-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend_app
    restart: always
    depends_on:
      - database
      - redis
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:5000"
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=  
    container_name: frontend_app
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
