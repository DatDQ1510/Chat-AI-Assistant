server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================
    # 1) React SPA
    # ==========================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================
    # 2) API PROXY
    # ==========================
    # Frontend gọi /v1/api/auth/login -> Nginx proxy -> http://backend:5000/v1/api/auth/login
    location /v1/api/ {
        proxy_pass http://backend:5000/v1/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================
    # 3) SOCKET.IO Websocket
    # ==========================
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ==========================
    # 4) Cache static
    # ==========================
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|json)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ==========================
    # 5) GZIP
    # ==========================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
