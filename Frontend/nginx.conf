server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;  # nơi build React/Vue được copy vào
    index index.html;

    # SPA route: nếu không tìm thấy file, trả về index.html
    location / {
        try_files $uri /index.html;
    }

    # API proxy sang backend
    location /v1/api/ {
        proxy_pass http://backend:5000/;  # backend container hoặc server
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO / WebSocket
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Cache static files
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|json)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
